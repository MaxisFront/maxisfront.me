baseURL = "https://maxisfront.me"
languageCode = "es"
title = "MaxisFront"

timeZone = "America/Mexico_City"
enableRobotsTXT = true
enableGitInfo = true
defaultContentLanguage = "es"
defaultContentLanguageInSubdir = true

[module]
  [[module.imports]]
    path = "go.ngs.io/hugo-primer-blog"

# Crucial para que el módulo Archive funcione
[taxonomies]
  archive = "archives"
  tag = "tags"

[params]
  sidebar = true            # Enable/disable sidebar
  mainSections = ['posts']
  recentPostsCount = 5      # Number of recent posts in sidebar module
  defaultTheme = "auto"     # auto, light, or dark
  dateFormat = "2006-01-02"
  showReadingTime = true
  showAuthor = true
  showShareButtons = true
  googleAnalyticsID = "G-EY36TLSMFS"  # Google Analytics 4 ID
  customCSS = ["css/custom_properties.css"] # Insertar custom CSS

  # Sidebar modules - order determines display order
  # Available: recentPosts, tags, categories, archive, links (+ custom partials)
  [[params.sidebarModules]]
    partial = "recentPosts"

  [[params.sidebarModules]]
    partial = "links"  

  [[params.sidebarModules]]
    partial = "tags"

  [[params.sidebarModules]]
    partial = "archive"

  [[params.sidebarModules]]
    partial = "toc" # Habilitar la Table of Content

  [params.social]
    github = "MaxisFront"
    x = "MaxisFront"

  faviconPng = "favicon.png"
  
[languages]
  [languages.es]
    languageName = "Español"
    languageCode = "es"
    weight = 1
    contentDir = "content"

    [languages.es.params]
      description = "Notas y WriteUps de ciberseguridad/pentesting (HTB, VulnHub...)"

    [[languages.es.menus.main]]
      name = "Inicio"
      pageRef = "/"
      weight = 1
  
    [[languages.es.menus.main]]
      name = "Publicaciones"
      pageRef = "/posts"
      weight = 2

    [[languages.es.menus.main]]
      name = "Acerca de Mí"
      pageRef = "/about"
      weight = 3

  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    contentDir = "content"

    [languages.en.params]
      description = "Cybersecurity/pentesting notes and writeups (HTB, VulnHub...)"

    [[languages.en.menus.main]]
      name = "Home"
      pageRef = "/"
      weight = 1

    [[languages.en.menus.main]]
      name = "Posts"
      pageRef = "/posts"
      weight = 2

      [[languages.en.menus.main]]
      name = "About"
      pageRef = "/about"
      weight = 3
    

# Custom stuff
# Enable write html code
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
    unsafe = true
    hardLineBreak = true
    [markup.goldmark.parser]
      wrapStandAloneImageWithinParagraph = false
      [markup.goldmark.parser.attribute]
        block = true


[markup.highlight]
  anchorLineNos = true
  codeFences = true
  guessSyntax = true
  hl_Lines = ''
  hl_inline = false
  lineAnchors = ''
  lineNoStart = 1
  lineNos = false
  lineNumbersInTable = true
  noClasses = true # Esencial para el highlight
  style = 'dracula'
  tabWidth = 4
  wrapperClass = 'highlight'
